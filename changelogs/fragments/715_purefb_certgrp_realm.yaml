bugfixes:
  - purefb_certgrp - a certificate named without its realm, or taken from another realm or from
    array level, is refused before any request, in check mode too. Before, the add failed on the
    array after check mode had reported a change, and a removal reported no change while the
    member stayed in the group.
  - purefb_certgrp - certificate names are compared without regard to case, as the array does. A
    member spelled in another case is no longer reported as changed on every run and is removed
    when ``state=absent`` names it.
  - purefb_certgrp - a failed read of the certificate group fails the task with the array's
    message instead of being taken for a group that does not exist.
  - purefb_certgrp - check mode fails for a new group named into a realm that does not exist or
    has been destroyed, as the real run does.
