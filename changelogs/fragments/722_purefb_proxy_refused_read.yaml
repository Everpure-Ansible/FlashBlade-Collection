bugfixes:
  - purefb_proxy - a read of the support settings that the array refuses or fails now fails with the
    error of the array instead of a traceback, in check mode too. Purity//FB refuses this read to an
    administrator whose management access is limited to a realm.
  - purefb_proxy - ``state=present`` without ``host`` and ``port``, or with one of them given as
    null, is now refused before the array is contacted instead of ending in a traceback or sending
    ``None`` as the port.
