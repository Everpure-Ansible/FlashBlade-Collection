bugfixes:
  - purefb_saml - ``state=test`` no longer ends in a traceback when the array refuses the test, and
    fails for an identity provider that does not exist instead of reporting ok without a result.
  - purefb_saml - a failed read of the identity provider is reported with the array's message
    instead of being taken for a missing provider.
  - purefb_saml - a realm-qualified ``name`` or certificate reference is refused before any request,
    so check mode no longer predicts a change that the array refuses.
  - purefb_saml - ``x509_cert``, ``signing_credential`` and ``decryption_credential`` named in
    another letter case than the certificate are no longer reported as a change.
  - purefb_saml - a ``name`` with a ``*`` or a comma is refused. The array reads them as a pattern
    and as a separator of names, so such a name could reach other identity providers than the one
    meant.
