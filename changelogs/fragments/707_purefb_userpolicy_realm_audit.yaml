bugfixes:
  - purefb_userpolicy - a policy name the array cannot resolve (a policy that does not exist, or a
    policy of an account in a realm named without ``realm::account/``) no longer ends in a traceback
    after the policies listed before it were attached. Every policy is checked before the first
    write and the task fails with a message; a read the array refuses is reported with its message.
  - purefb_userpolicy - check mode reports what a run changes instead of always reporting unchanged,
    and a policy of another account is refused before anything is written, in check mode too.
  - purefb_userpolicy - ``policy_list`` holds the policies of the user once each, also when nothing
    changed.
  - purefb_userpolicy - an ``account``, a ``name`` or an entry of ``policy`` with a ``*`` or a
    comma, which the array reads as a pattern or as a list of names, is refused before anything is
    read. Such a name addresses several users or policies, so the task was checked against one of
    them and the request was sent for all of them.
