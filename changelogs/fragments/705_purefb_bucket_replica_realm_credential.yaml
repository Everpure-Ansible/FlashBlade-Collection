bugfixes:
  - purefb_bucket_replica - a bucket and a remote credential that are not in the same realm are
    refused before anything is written, in check mode too. Such a pair was sent to the array on
    create and on a credential change, and check mode reported a change.
  - purefb_bucket_replica - a create the array refuses is reported with the array's error, and a
    read the array refuses is no longer taken for a missing bucket, credential, target or link.
  - purefb_bucket_replica - a ``credential`` or ``target`` written in another letter case than the
    array stores is no longer sent as a change on every run or reported as not connected.
  - purefb_bucket_replica - a new replica link for a destroyed bucket is refused before anything
    is written, in check mode too. Check mode reported a change that the array refuses.
