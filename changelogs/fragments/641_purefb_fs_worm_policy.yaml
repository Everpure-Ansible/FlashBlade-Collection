minor_changes:
  - purefb_fs - new ``worm_policy`` and ``eradication_mode`` options create WORM-protected filesystems
    (Purity//FB REST 2.15). Both are set at creation only; a different value on an existing filesystem
    fails the task.
  - purefb_info - the ``filesystems`` subset reports each filesystem's ``eradication_mode`` and attached
    ``worm_policy`` (Purity//FB REST 2.15 or later), so the values set by purefb_fs can be read back.
