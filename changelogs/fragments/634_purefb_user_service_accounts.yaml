minor_changes:
  - purefb_user - new ``admin_type`` creates REST-only service accounts (REST 2.26). The type is
    fixed at creation and a service account takes no password or public key.
  - purefb_user - new ``management_access_policies`` gives a local user or service account its
    policies in place of ``role`` (REST 2.19); an existing account is converged through the
    policy membership endpoints, attaching before detaching.
  - purefb_user - new ``authorization_model`` fixes the policies of a remote user on the array
    (``static`` with the list) or returns it to directory-service authorization (``dynamic``),
    REST 2.24.
  - purefb_info - the ``admins`` subset reports ``admin_type`` and ``authorization_model`` from
    REST 2.24 and always carries ``token_created`` and ``token_expires``.
